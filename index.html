px solid #eee}th{background:#edf5eb}.profile{text-align:center;background:#fff;padding:25px;border-radius:20px}.avatar{width:75px;height:75px;background:#dcefd8;border-radius:50%;margin:auto;display:flex;align-items:center;justify-content:center;font-size:35px}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);height:70px;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:space-around;z-index:10}.bottom button{background:none;color:#777;font-size:19px}.bottom span{display:block;font-size:10px}.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#172117;color:#fff;padding:12px 18px;border-radius:12px;display:none;z-index:20}</style></head><body><div class="app"><header><div><div class="logo">🌱 KrishiSathi</div><small>किसान का अपना साथी</small></div><button onclick="show('profile')">👤</button></header><main id="app"></main><nav class="bottom"><button onclick="show('home')">🏠<span>होम</span></button><button onclick="show('booking')">🚜<span>बुकिंग</span></button><button onclick="show('market')">🛒<span>बाज़ार</span></button><button onclick="show('mandi')">📈<span>मंडी</span></button><button onclick="show('profile')">👤<span>प्रोफाइल</span></button></nav></div><div id="toast" class="toast"></div><script>

function filterProducts(q){q=q.toLowerCase();document.querySelectorAll("#products .item").forEach(x=>x.style.display=x.innerText.toLowerCase().includes(q)?"flex":"none")}

function mandi(){let r=[["गेहूं","₹2,450","+₹35"],["सोयाबीन","₹4,620","+₹80"],["चना","₹5,150","+₹20"],["मक्का","₹2,180","-₹15"]];app.innerHTML=`<button class="back" onclick="show('home')">← वापस</button><h2>📈 मंडी भाव</h2><input class="search" placeholder="🔎 फसल खोजें" oninput="filterMandi(this.value)"><p class="muted">Demo: Jabalpur मंडी</p><table id="manditable"><tr><th>फसल</th><th>भाव</th><th>बदलाव</th></tr>${r.map(x=>`<tr><td>${x[0]}</td><td><b>${x[1]}</b></td><td>${x[2]}</td></tr>`).join("")}</table><p class="muted">* Live mandi API अभी connected नहीं है।</p>`}
function filterMandi(q){q=q.toLowerCase();document.querySelectorAll("#manditable tr").forEach((r,i)=>{if(i)r.style.display=r.innerText.toLowerCase().includes(q)?"table-row":"none"})}
function profile(){app.innerHTML=`<button class="back" onclick="show('home')">← वापस</button><h2>👤 प्रोफाइल</h2><div class="profile"><div class="avatar">👨‍🌾</div><h2>किसान</h2><p class="muted">मोबाइल: +91 XXXXX XXXXX</p></div><div class="section">सेटिंग्स</div><div class="card"><p>🔔 नोटिफिकेशन ON</p><hr><p>📍 लोकेशन ON</p><hr><p>🌐 भाषा हिंदी</p></div><div class="section">सहायता</div><button class="btn secondary" onclick="show('help')">🆘 Help & Support</button>`}
function help(){app.innerHTML=`<button class="back" onclick="show('home')">← वापस</button><h2>🆘 मदद और सहायता</h2><div class="list"><div class="card"><b>बुकिंग कैसे करें?</b><p class="muted">ट्रैक्टर या मशीन चुनें और "बुक" दबाएँ।</p></div><div class="card"><b>पेमेंट कैसे होगा?</b><p class="muted">Production version में payment gateway जोड़ा जाएगा।</p></div></div>`}
function toast(t){let e=document.getElementById("toast");e.innerText=t;e.style.display="block";setTimeout(()=>e.style.display="none",2200)}
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));show("home");
</script>

<script type="module">
  import { getApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    signOut,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

  const auth = getAuth(getApp());

  document.body.insertAdjacentHTML("afterbegin", `
    <div id="ksLogin" style="
      position:fixed;
      inset:0;
      z-index:99999;
      background:#f5f7f2;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      font-family:Arial,sans-serif;
    ">
      <div style="
        background:white;
        width:100%;
        max-width:380px;
        padding:25px;
        border-radius:18px;
        box-shadow:0 5px 25px #0002;
      ">
        <h2 style="text-align:center;margin:0 0 8px">
          🌾 KrishiSathi
        </h2>

        <p style="text-align:center;color:#666">
          किसान का अपना साथी
        </p>

        <input id="ksEmail" type="email"
          placeholder="Email"
          style="width:100%;padding:13px;margin:8px 0;
          border:1px solid #ddd;border-radius:10px;box-sizing:border-box">

        <input id="ksPass" type="password"
          placeholder="Password"
          style="width:100%;padding:13px;margin:8px 0;
          border:1px solid #ddd;border-radius:10px;box-sizing:border-box">

        <button id="ksLoginBtn" style="
          width:100%;padding:13px;margin-top:10px;
          border:0;border-radius:10px;
          background:#2e7d32;color:white;font-size:16px;
        ">🔑 Login</button>

        <button id="ksSignupBtn" style="
          width:100%;padding:13px;margin-top:10px;
          border:1px solid #2e7d32;border-radius:10px;
          background:white;color:#2e7d32;font-size:16px;
        ">📝 Create Account</button>

        <p id="ksMsg" style="
          text-align:center;
          font-size:14px;
          color:#d32f2f;
          min-height:20px;
        "></p>
      </div>
    </div>
  `);

  const loginBox = document.getElementById("ksLogin");
  const email = document.getElementById("ksEmail");
  const pass = document.getElementById("ksPass");
  const msg = document.getElementById("ksMsg");

  document.getElementById("ksSignupBtn").onclick = async () => {
    msg.innerText = "";

    if (!email.value || !pass.value) {
      msg.innerText = "Email और Password भरें";
      return;
    }

    if (pass.value.length < 6) {
      msg.innerText = "Password कम से कम 6 characters का होना चाहिए";
      return;
    }

    try {
      await createUserWithEmailAndPassword(
        auth,
        email.value.trim(),
        pass.value
      );
      msg.style.color = "#2e7d32";
      msg.innerText = "✅ Account बन गया!";
    } catch (error) {
      msg.style.color = "#d32f2f";
      msg.innerText = "❌ " + error.message;
    }
  };

  document.getElementById("ksLoginBtn").onclick = async () => {
    msg.innerText = "";

    if (!email.value || !pass.value) {
      msg.innerText = "Email और Password भरें";
      return;
    }

    try {
      await signInWithEmailAndPassword(
        auth,
        email.value.trim(),
        pass.value
      );
    } catch (error) {
      msg.style.color = "#d32f2f";
      msg.innerText = "❌ Email या Password गलत है";
    }
  };

  onAuthStateChanged(auth, (user) => {
    if (user) {
      loginBox.style.display = "none";
      console.log("KrishiSathi User Login:", user.email);
    } else {
      loginBox.style.display = "flex";
    }
  });

  window.ksLogout = async () => {
    await signOut(auth);
  };
</script>
  <script type="module">
  import { getApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import {
    getAuth,
    createUserWithEmailAndPassword
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
  import {
    getFirestore,
    doc,
    setDoc,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

  const appFirebase = getApp();
  const auth = getAuth(appFirebase);
  const db = getFirestore(appFirebase);

  const pass = document.getElementById("ksPass");
  const signupBtn = document.getElementById("ksSignupBtn");
  const msg = document.getElementById("ksMsg");

  const roleBox = document.createElement("select");
  roleBox.id = "ksRole";
  roleBox.innerHTML = `
    <option value="farmer">👨‍🌾 किसान</option>
    <option value="tractor_owner">🚜 Tractor Owner</option>
  `;
  roleBox.style.cssText =
    "width:100%;padding:13px;margin:8px 0;border:1px solid #ddd;border-radius:10px;box-sizing:border-box;background:white";

  pass.insertAdjacentElement("afterend", roleBox);

  signupBtn.onclick = async () => {
    msg.style.color = "#d32f2f";
    msg.innerText = "";

    const email = document.getElementById("ksEmail").value.trim();
    const password = pass.value;
    const role = roleBox.value;

    if (!email || !password) {
      msg.innerText = "Email और Password भरें";
      return;
    }

    if (password.length < 6) {
      msg.innerText = "Password कम से कम 6 characters का होना चाहिए";
      return;
    }

    try {
      const result = await createUserWithEmailAndPassword(
        auth,
        email,
        password
      );

      await setDoc(doc(db, "users", result.user.uid), {
        email: email,
        role: role,
        createdAt: serverTimestamp()
      });

      msg.style.color = "#2e7d32";
      msg.innerText =
        role === "farmer"
          ? "✅ किसान Account बन गया!"
          : "✅ Tractor Owner Account बन गया!";

    } catch (error) {
      msg.style.color = "#d32f2f";
      msg.innerText = "❌ " + error.message;
    }
  };
  </script>
