<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#237a39"><meta name="description" content="KrishiSathi - किसान का अपना साथी"><link rel="manifest" href="manifest.json"><title>KrishiSathi</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f8f1;color:#182018}.app{max-width:480px;margin:auto;min-height:100vh;background:#f8fbf7;padding-bottom:75px}header{background:#fff;padding:16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5;border-bottom:1px solid #ddd}.logo{color:#237a39;font-size:22px;font-weight:bold}header small{color:#777}main{padding:16px}.hero{background:linear-gradient(135deg,#217b39,#64ae50);color:#fff;padding:22px;border-radius:22px;margin-bottom:18px}.hero h1{margin:8px 0;font-size:25px}.search{width:100%;padding:14px;border:1px solid #ddd;border-radius:13px;font-size:15px;margin-bottom:15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:#fff;padding:17px;border-radius:17px;border:1px solid #e3e9e0;box-shadow:0 2px 8px #0000000b}.service{cursor:pointer}.emoji{font-size:30px}.card h3{margin:8px 0 4px}.muted{color:#697469;font-size:13px}.section{margin-top:22px;margin-bottom:10px;font-size:19px;font-weight:bold}.list{display:flex;flex-direction:column;gap:11px}.item{background:#fff;padding:14px;border-radius:16px;display:flex;align-items:center;gap:12px;border:1px solid #e4eae1}.item-icon{width:55px;height:55px;background:#eaf4e8;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:27px}.grow{flex:1}.item h3{margin:0 0 5px;font-size:15px}button{border:0;cursor:pointer}.btn{padding:10px 13px;border-radius:11px;font-weight:bold}.primary{background:#267c3b;color:#fff}.secondary{background:#e7f2e5;color:#267c3b}.back{background:#e7f2e5;padding:10px 14px;border-radius:11px;margin-bottom:15px}.weather{background:#fff;border-radius:18px;padding:18px;display:flex;justify-content:space-between;align-items:center;border:1px solid #e3e9e0}.temp{font-size:38px;font-weight:bold}table{width:100%;border-collapse:collapse;background:#fff;border-radius:15px;overflow:hidden}th,td{padding:13px;text-align:left;border-bottom:1px solid #eee}th{background:#edf5eb}.profile{text-align:center;background:#fff;padding:25px;border-radius:20px}.avatar{width:75px;height:75px;background:#dcefd8;border-radius:50%;margin:auto;display:flex;align-items:center;justify-content:center;font-size:35px}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);height:70px;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:space-around;z-index:10}.bottom button{background:none;color:#777;font-size:19px}.bottom span{display:block;font-size:10px}.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#172117;color:#fff;padding:12px 18px;border-radius:12px;display:none;z-index:20}</style></head><body><div class="app"><header><div><div class="logo">🌱 KrishiSathi</div><small>किसान का अपना साथी</small></div><button onclick="show('profile')">👤</button></header><main id="app"></main><nav class="bottom"><button onclick="show('home')">🏠<span>होम</span></button><button onclick="show('booking')">🚜<span>बुकिंग</span></button><button onclick="show('market')">🛒<span>बाज़ार</span></button><button onclick="show('mandi')">📈<span>मंडी</span></button><button onclick="show('profile')">👤<span>प्रोफाइल</span></button></nav></div><div id="toast" class="toast"></div><script>
const app=document.getElementById("app");
function show(p){({home,booking,equipment,market,weather,mandi,profile,help}[p]||home)();scrollTo(0,0)}
function home(){app.innerHTML=`<div class="hero"><div>नमस्ते किसान 👋</div><h1>खेती का हर काम,<br>एक जगह</h1><p>ट्रैक्टर • मशीन • बाज़ार • मौसम • मंडी</p></div><input class="search" placeholder="🔎 सेवा खोजें" oninput="homeSearch(this.value)"><div class="section">आपको क्या चाहिए?</div><div class="grid" id="services"><div class="card service" onclick="show('booking')"><div class="emoji">🚜</div><h3>ट्रैक्टर बुक करें</h3><p class="muted">पास के ट्रैक्टर</p></div><div class="card service" onclick="show('equipment')"><div class="emoji">🛠️</div><h3>मशीन किराये पर</h3><p class="muted">खेती के उपकरण</p></div><div class="card service" onclick="show('market')"><div class="emoji">🛒</div><h3>कृषि बाज़ार</h3><p class="muted">बीज • खाद • दवा</p></div><div class="card service" onclick="show('weather')"><div class="emoji">🌦️</div><h3>मौसम</h3><p class="muted">आज का मौसम</p></div><div class="card service" onclick="show('mandi')"><div class="emoji">📈</div><h3>मंडी भाव</h3><p class="muted">फसल के भाव</p></div><div class="card service" onclick="show('help')"><div class="emoji">🆘</div><h3>मदद</h3><p class="muted">Support</p></div></div><div class="section">आज की जानकारी</div><div class="weather"><div><b>🌦️ मौसम</b><p class="muted">आंशिक बादल</p></div><div class="temp">28°</div></div>`}
function homeSearch(q){q=q.toLowerCase();document.querySelectorAll("#services .service").forEach(x=>x.style.display=x.innerText.toLowerCase().includes(q)?"block":"none")}
function listPage(t,d){app.innerHTML=`<button class="back" onclick="show('home')">← वापस</button><h2>${t}</h2><div class="list">${d.map(x=>`<div class="item"><div class="item-icon">${x[0]}</div><div class="grow"><h3>${x[1]}</h3><div class="muted">${x[3]}</div><b>${x[2]}</b></div><button class="btn primary" onclick="book('${x[1]}')">बुक</button></div>`).join("")}</div>`}
function booking(){listPage("🚜 ट्रैक्टर बुकिंग",[["🚜","Mahindra 575 DI","₹700/घंटा","2.4 km दूर"],["🚜","Swaraj 744 FE","₹850/घंटा","4.1 km दूर"],["🚜","Sonalika DI 35","₹650/घंटा","5.8 km दूर"]])}
function equipment(){listPage("🛠️ मशीन किराये पर",[["🌾","Rotavator","₹500/घंटा",""],["🌱","Seed Drill","₹650/घंटा",""],["🪓","Cultivator","₹350/घंटा",""]])}
function book(n){toast("✅ "+n+" की booking request भेज दी गई")}
function market(){let p=[["🌾","गेहूं बीज","₹2,450 / 40kg"],["🧪","DAP खाद","₹1,350 / 50kg"],["🌱","सोयाबीन बीज","₹3,200 / 30kg"],["🧴","कीटनाशक","₹780 / लीटर"]];app.innerHTML=`<button class="back" onclick="show('home')">← वापस</button><h2>🛒 कृषि बाज़ार</h2><input class="search" placeholder="🔎 सामान खोजें" oninput="filterProducts(this.value)"><div id="products" class="list">${p.map(x=>`<div class="item"><div class="item-icon">${x[0]}</div><div class="grow"><h3>${x[1]}</h3><b>${x[2]}</b></div><button class="btn primary" onclick="toast('🛒 ${x[1]} cart में जोड़ा गया')">जोड़ें</button></div>`).join("")}</div>`}
function filterProducts(q){q=q.toLowerCase();document.querySelectorAll("#products .item").forEach(x=>x.style.display=x.innerText.toLowerCase().includes(q)?"flex":"none")}
function weather(){app.innerHTML=`<button class="back" onclick="show('home')">← वापस</button><h2>🌦️ मौसम</h2><div class="weather"><div><h3>Jabalpur</h3><p class="muted">आंशिक बादल</p><p class="muted">बारिश: 30%</p></div><div class="temp">28°</div></div><div class="section">🌾 खेती सलाह</div><div class="card"><b>💧 सिंचाई</b><p class="muted">मौसम देखकर सिंचाई की योजना करें।</p></div><p class="muted">* अभी demo weather data है।</p>`}
function mandi(){let r=[["गेहूं","₹2,450","+₹35"],["सोयाबीन","₹4,620","+₹80"],["चना","₹5,150","+₹20"],["मक्का","₹2,180","-₹15"]];app.innerHTML=`<button class="back" onclick="show('home')">← वापस</button><h2>📈 मंडी भाव</h2><input class="search" placeholder="🔎 फसल खोजें" oninput="filterMandi(this.value)"><p class="muted">Demo: Jabalpur मंडी</p><table id="manditable"><tr><th>फसल</th><th>भाव</th><th>बदलाव</th></tr>${r.map(x=>`<tr><td>${x[0]}</td><td><b>${x[1]}</b></td><td>${x[2]}</td></tr>`).join("")}</table><p class="muted">* Live mandi API अभी connected नहीं है।</p>`}
function filterMandi(q){q=q.toLowerCase();document.querySelectorAll("#manditable tr").forEach((r,i)=>{if(i)r.style.display=r.innerText.toLowerCase().includes(q)?"table-row":"none"})}
function profile(){app.innerHTML=`<button class="back" onclick="show('home')">← वापस</button><h2>👤 प्रोफाइल</h2><div class="profile"><div class="avatar">👨‍🌾</div><h2>किसान</h2><p class="muted">मोबाइल: +91 XXXXX XXXXX</p></div><div class="section">सेटिंग्स</div><div class="card"><p>🔔 नोटिफिकेशन ON</p><hr><p>📍 लोकेशन ON</p><hr><p>🌐 भाषा हिंदी</p></div><div class="section">सहायता</div><button class="btn secondary" onclick="show('help')">🆘 Help & Support</button>`}
function help(){app.innerHTML=`<button class="back" onclick="show('home')">← वापस</button><h2>🆘 मदद और सहायता</h2><div class="list"><div class="card"><b>बुकिंग कैसे करें?</b><p class="muted">ट्रैक्टर या मशीन चुनें और "बुक" दबाएँ।</p></div><div class="card"><b>पेमेंट कैसे होगा?</b><p class="muted">Production version में payment gateway जोड़ा जाएगा।</p></div></div>`}
function toast(t){let e=document.getElementById("toast");e.innerText=t;e.style.display="block";setTimeout(()=>e.style.display="none",2200)}
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));show("home");
</script>
